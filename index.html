<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye · Anonymous group</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }

        /* main card – anonymous group message style */
        .message-card {
            max-width: 680px;
            width: 100%;
            background: rgba(22, 27, 38, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 48px;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: transform 0.2s ease;
            animation: floatIn 0.9s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* anonymous group header */
        .group-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .group-icon {
            width: 48px;
            height: 48px;
            background: #2a3140;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .group-info h2 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #eef2f8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: #2e3646;
            color: #b7c1d4;
            font-size: 0.68rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 4px 9px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .group-info .meta {
            font-size: 0.78rem;
            color: #8e9aad;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta svg {
            width: 14px;
            height: 14px;
            fill: #8e9aad;
        }

        /* anonymous sender line */
        .sender-line {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .avatar-placeholder {
            width: 42px;
            height: 42px;
            background: #2e364a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #cbd5e6;
            box-shadow: 0 4px 8px -4px #00000055;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .sender-label {
            display: flex;
            flex-direction: column;
        }

        .sender-name {
            font-weight: 500;
            color: #cbd5e6;
            font-size: 0.96rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sender-name .anon-tag {
            background: #232a38;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 30px;
            color: #9aa8c0;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border: 1px solid #323c4e;
        }

        .sender-time {
            font-size: 0.7rem;
            color: #6c7a91;
            margin-top: 2px;
        }

        /* big good bye text */
        .goodbye-container {
            text-align: center;
            padding: 8px 0 18px;
        }

        .goodbye-main {
            font-size: clamp(3.2rem, 15vw, 5.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            background: linear-gradient(135deg, #ffffff 0%, #b7c8f0 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(130, 170, 255, 0.4), 0 10px 30px -10px #00000080;
            margin-bottom: 12px;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 20px rgba(130, 170, 255, 0.3), 0 10px 30px -10px black;
                opacity: 0.95;
            }
            100% {
                text-shadow: 0 0 45px rgba(150, 190, 255, 0.8), 0 10px 30px -5px black;
                opacity: 1;
            }
        }

        .goodbye-sub {
            font-size: 1.1rem;
            color: #9daabf;
            letter-spacing: 0.3px;
            font-weight: 400;
            background: rgba(45, 55, 75, 0.4);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 12px -6px black;
        }

        /* anonymous group message footer */
        .message-footer {
            margin-top: 38px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #5f6c82;
            font-size: 0.8rem;
        }

        .reactions {
            display: flex;
            gap: 18px;
        }

        .reaction-item {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .reaction-item:hover {
            opacity: 1;
        }

        .reaction-item span {
            font-size: 1rem;
        }

        .anonymous-mark {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1f2532;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.72rem;
            color: #8896b0;
            border: 1px solid #2d3547;
            letter-spacing: 0.02em;
        }

        .anonymous-mark svg {
            width: 14px;
            height: 14px;
            fill: #8896b0;
        }

        /* responsive */
        @media (max-width: 480px) {
            .message-card {
                padding: 1.8rem 1.2rem;
                border-radius: 36px;
            }

            .group-icon {
                width: 40px;
                height: 40px;
                font-size: 22px;
                border-radius: 14px;
            }

            .avatar-placeholder {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .goodbye-sub {
                font-size: 0.9rem;
                padding: 6px 18px;
            }

            .message-footer {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="message-card">
        <!-- Group header -->
        <div class="group-header">
            <div class="group-icon">👥</div>
            <div class="group-info">
                <h2>
                    anonymous group
                    <span class="badge">private</span>
                </h2>
                <div class="meta">
                    <svg viewBox="0 0 24 24" width="14" height="14">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span>7 members · 3 online</span>
                </div>
            </div>
        </div>

        <!-- Sender line (anonymous) -->
        <div class="sender-line">
            <div class="avatar-placeholder">🕶️</div>
            <div class="sender-label">
                <div class="sender-name">
                    Anonymous
                    <span class="anon-tag">hidden</span>
                </div>
                <div class="sender-time">just now · group message</div>
            </div>
        </div>

        <!-- BIG GOOD BYE TEXT (with anonymous group message) -->
        <div class="goodbye-container">
            <div class="goodbye-main">GOOD BYE</div>
            <div class="goodbye-sub">👋 from the anonymous group</div>
        </div>

        <!-- Footer with anonymous mark -->
        <div class="message-footer">
            <div class="reactions">
                <div class="reaction-item"><span>❤️</span> 12</div>
                <div class="reaction-item"><span>👍</span> 8</div>
                <div class="reaction-item"><span>😢</span> 5</div>
            </div>
            <div class="anonymous-mark">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
                anonymous group message
            </div>
        </div>
    </div>
</body>
</html>
